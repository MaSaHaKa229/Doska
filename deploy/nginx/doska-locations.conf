# Общие правила сайта (подключаются в http- и https-конфигурации).
# $hsts задаёт конфигурация: по HTTPS — max-age, по HTTP — пусто (заголовок не отправляется).

# Сжатие текстовых ответов (скрипты сайта — несколько мегабайт).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

# Файлы (картинки до 15 МБ, PDF до 50 МБ) — с запасом.
client_max_body_size 60m;

# API сервера.
location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
}

# Совместная работа на досках: WebSocket.
location /ws/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Соединение урока живёт часами; сервер сам шлёт пинги.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Собранные файлы Vite: имена с хешем — кешируются надолго.
location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $hsts always;
    try_files $uri =404;
}

# Приложение (SPA): любые пути — index.html, без кеширования.
location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Свои add_header в location отменяют заголовки уровня server — HSTS повторяется здесь.
    add_header Strict-Transport-Security $hsts always;
}
